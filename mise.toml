[tool_alias]
marp = "npm:@marp-team/marp-cli"
rumdl = "aqua:rvben/rumdl"
typos = "github:crate-ci/typos"

[tools]
hk = "1.48.0"
pkl = "0.31.1"
python = "3.12"
typos = "1.47.2"
rumdl = "0.2.14"
"pipx:apm-cli" = "0.20.0"
marp = "4.4.0"

[env]
HK_MISE = "1"

[tasks.wiki-check]
description = "Validate the LLM-Wiki schema, log, links, and page provenance"
run = "python tools/wiki_check.py"

[tasks.gitattributes-generate]
description = "Generate .gitattributes from gitattributes.pkl"
run = "python tools/gitattributes.py generate"

[tasks.gitattributes-check]
description = "Check .gitattributes generation and indexed file coverage"
run = "python tools/gitattributes.py check"

[tasks.translation-agent-plugin-check]
description = "Validate the enterprise translation team Copilot plugin"
run = "python .agents/plugins/enterprise-translation-team/scripts/validate_package.py"

[tasks.translation-agent-plugin-eval-dry-run]
description = "Prepare a dry-run eval workspace for the enterprise translation team plugin"
run = "python .agents/plugins/enterprise-translation-team/scripts/run_copilot_evals.py --mode dry-run"

[tasks.apm-install-enterprise-translation-plugin]
description = "Install the enterprise translation team plugin with APM"
run = "apm install --target copilot"
